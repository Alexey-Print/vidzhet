name: Сборка APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
      - run: |
          cp app/build/outputs/apk/release/app-release.apk vidzhet.apk
          echo "$GITHUB_RUN_NUMBER" > version.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Часы-календарь
          files: |
            vidzhet.apk
            version.txt
          make_latest: true
